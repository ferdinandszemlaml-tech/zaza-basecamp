<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tým · ZaZa BaseCamp</title>
<meta name="theme-color" content="#0B4A44">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<style>
.call { width: 48px; height: 48px; border-radius: 50%; background: var(--green); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none; }
.call:hover { background: #083A35; color: #fff; }
.num { font-size: 15px; font-weight: 700; color: var(--green); text-decoration: none; }
.nophone { font-size: 14px; color: var(--muted-2); }
.search { display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--field); border-radius: 999px; padding: 0 18px; max-width: 420px; width: 100%; margin: 0 auto; }
.search input { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; color: var(--ink); padding: 12px 0; min-width: 0; }
.search svg { color: var(--muted-2); flex-shrink: 0; }
.addr { font-size: 13px; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
<main class="bc-main" id="main"><p class="muted">Načítám…</p></main>
<script src="/app.js"></script>
<script>
(async () => {
  await BC.init({ active: 'tym' });
  const { team } = await BC.api('team');
  const { esc } = BC;

  document.getElementById('main').innerHTML = `
    <div class="page-head"><h1>Tým</h1>
    <p class="lead">Kontakty na kolegy. Klepnutím na číslo rovnou voláš.</p></div>
    <label class="search">${BC.icon('search', 20)}<span class="sr-only">Hledat kolegu</span>
      <input id="q" type="search" placeholder="Hledat jméno"></label>
    <div class="card" id="list"></div>
  `;

  function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const shown = team.filter((m) => BC.whoMatch(m, q));
    document.getElementById('list').innerHTML = shown.length ? shown.map((m) => `
      <div class="item">
        <span class="avatar soft" style="width:44px;height:44px;font-size:15px">${esc(BC.initials(m.name))}</span>
        <span class="item-main"><span class="item-title">${BC.who(m)}</span>
          <span class="item-sub">${m.positions.map(BC.positionName).map(esc).join(' · ') || (m.role === 'admin' ? 'Vedení' : m.role === 'provozni' ? 'Provozní' : '')}</span>
          ${m.phone ? `<a class="num" href="${BC.telHref(m.phone)}">${esc(m.phone)}</a>` : '<span class="nophone">bez čísla</span>'}
          ${m.address ? `<span class="addr"><span style="display:inline-flex;align-items:center;gap:4px">${BC.icon('home', 14)}${esc(m.address.split(/\n/)[0])}</span>${m.address.includes('\n') ? `<br>${esc(m.address.split(/\n/).slice(1).join(', '))}` : ''}</span>` : ''}</span>
        ${m.phone ? `<a class="call" href="${BC.telHref(m.phone)}" aria-label="Zavolat ${esc(BC.displayName(m))}">${BC.icon('phone', 22)}</a>` : ''}
      </div>`).join('') : '<div class="empty">Nikoho takového nenacházím.</div>';
  }
  document.getElementById('q').addEventListener('input', render);
  render();
})().catch(BC.fail);
</script>
</body>
</html>
