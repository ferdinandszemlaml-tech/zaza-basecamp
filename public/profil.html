<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Můj profil · ZaZa BaseCamp</title>
<meta name="theme-color" content="#0B4A44">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<style>
.pgrid { display: flex; flex-direction: column; gap: 14px; }
.pgrid .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 900px) { .pgrid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: start; } .pgrid .col { gap: 16px; } }
</style>
</head>
<body>
<main class="bc-main" id="main"><p class="muted">Načítám…</p></main>
<script src="/app.js"></script>
<script>
(async () => {
  const me = await BC.init({ active: 'profil' });
  const { reads } = await BC.api('my-reads');
  const { esc } = BC;
  const u = me.user;
  const SHOW = 8;

  const readRow = (r) => `<div class="item">${BC.mark('ok')}
    <span class="item-main"><span class="item-title">${esc(r.title)}</span>
    <span class="item-sub">${esc(BC.sectionName(r.section))} · ${r.kind === 'link' ? 'odkaz' : `verze ${esc(r.version)}`}${r.mandatory ? '' : ' · nepovinné'}</span></span>
    <span class="small muted">${BC.fmtDate(r.at)}</span></div>`;

  document.getElementById('main').innerHTML = `
    <div class="page-head">
      <div class="avatar" style="width:72px;height:72px;font-size:24px">${esc(BC.initials(u.name))}</div>
      <h1 style="font-size:${u.nick ? 34 : 30}px">${BC.who(u)}</h1><span class="muted">${esc(u.username)}${u.role === 'admin' ? ' · admin' : u.role === 'provozni' ? ' · provozní' : ''}</span>
      ${u.positions.length ? `<div class="chips" style="justify-content:center">${BC.posChips(u.positions)}</div>` : ''}
    </div>
    <div class="pgrid"><div class="col">
    <div class="card card-pad stack" style="gap:14px">
      <h2 style="font-size:24px">Moje údaje</h2>
      <form class="stack" id="meForm" novalidate style="gap:12px">
        <div class="error" id="meErr" role="alert" hidden></div>
        <div class="field"><label for="nick">Přezdívka <span class="muted" style="font-weight:400">(nepovinné)</span></label>
          <input class="input" id="nick" maxlength="30" autocomplete="nickname" placeholder="např. Terka" value="${esc(u.nick)}">
          <span class="hint">Jak ti v týmu říkáme. Ukazuje se místo jména v Týmu i ve směnách.</span></div>
        <div class="field"><label for="phone">Telefon</label>
          <input class="input" id="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+420 777 123 456" value="${esc(u.phone)}">
          <span class="hint">Uvidí ho kolegové v záložce Tým, aby ti mohli zavolat.</span></div>
        <div class="field"><label for="address">Kde teď bydlíš <span class="muted" style="font-weight:400">(přechodné bydliště)</span></label>
          <textarea class="input textarea" id="address" rows="2" maxlength="200" autocomplete="street-address" placeholder="např. Křenová 12, 602 00 Brno">${esc(u.address)}</textarea>
          <span class="hint">Vidí jen vedení a provozní, ostatním kolegům se neukazuje.</span></div>
        <div class="field"><label for="tshirt">Velikost trička</label>
          <select class="input" id="tshirt"><option value="">– nevyplněno –</option>${(BC.meta.tshirtSizes ?? []).map((t) => `<option${u.tshirt === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>
          <span class="hint">Kvůli pracovním tričkům. Vidí jen vedení.</span></div>
        <button class="btn small" type="submit" id="meSave" style="align-self:flex-start;height:46px">Uložit údaje</button>
      </form>
      <div style="border-top:1px solid var(--line-2);padding-top:10px">
        <button type="button" class="btn small ghost" id="pwToggle" aria-expanded="false" aria-controls="pwForm" style="color:var(--green);padding:0 6px;height:38px">${BC.icon('edit', 16)}Změnit heslo</button>
      </div>
      <form class="stack" id="pwForm" hidden novalidate style="gap:12px">
        <div class="error" id="pwErr" role="alert" hidden></div>
        <div class="field"><label for="cur">Současné heslo</label><input class="input" id="cur" type="password" autocomplete="current-password"></div>
        <div class="field"><label for="n1">Nové heslo</label><input class="input" id="n1" type="password" autocomplete="new-password" minlength="8"><span class="hint">Aspoň 8 znaků.</span></div>
        <div class="field"><label for="n2">Nové heslo znovu</label><input class="input" id="n2" type="password" autocomplete="new-password"></div>
        <div class="row" style="gap:8px"><button class="btn small" type="submit" id="pwSave" style="height:46px">Uložit nové heslo</button><button type="button" class="btn small ghost" id="pwCancel" style="color:var(--muted);height:46px">Zrušit</button></div>
      </form>
    </div>
    </div><div class="col">
    <h2 style="font-size:24px">Přečtené dokumenty</h2>
    ${reads.length ? `<div class="card" id="reads">${reads.slice(0, SHOW).map(readRow).join('')}</div>
      ${reads.length > SHOW ? `<button type="button" class="btn small soft" id="more" style="align-self:center">Zobrazit vše (${reads.length})</button>` : ''}`
      : '<div class="card empty">Zatím jsi nic neotevřel/a.</div>'}

    <div class="spacer" style="min-height:4px"></div>
    <button type="button" class="btn outline block" id="logout" style="border:2px solid var(--coral);color:var(--coral-dark);background:#fff">${BC.icon('back', 20)}Odhlásit se</button>
    </div></div>
  `;

  document.getElementById('meForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('meSave');
    const err = document.getElementById('meErr');
    err.hidden = true; btn.disabled = true;
    const val = (id) => document.getElementById(id).value;
    try {
      const r = await BC.api('me', { method: 'PATCH', body: { nick: val('nick'), phone: val('phone'), address: val('address'), tshirt: val('tshirt') } });
      for (const k of ['nick', 'phone', 'address', 'tshirt']) document.getElementById(k).value = r.user[k];
      document.querySelector('h1').innerHTML = BC.who(r.user);
      BC.toast('Údaje jsou uložené.');
    } catch (ex) { err.textContent = ex.message; err.hidden = false; }
    finally { btn.disabled = false; }
  });
  document.getElementById('more')?.addEventListener('click', (e) => {
    document.getElementById('reads').innerHTML = reads.map(readRow).join('');
    e.currentTarget.remove();
  });
  const toggle = document.getElementById('pwToggle');
  const form = document.getElementById('pwForm');
  toggle.addEventListener('click', () => {
    form.hidden = !form.hidden;
    toggle.setAttribute('aria-expanded', String(!form.hidden));
    if (!form.hidden) form.cur.focus();
  });
  document.getElementById('pwCancel').addEventListener('click', () => { form.reset(); form.hidden = true; toggle.setAttribute('aria-expanded', 'false'); document.getElementById('pwErr').hidden = true; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('pwErr');
    err.hidden = true;
    if (form.n1.value.length < 8) { err.textContent = 'Nové heslo musí mít aspoň 8 znaků.'; err.hidden = false; return; }
    if (form.n1.value !== form.n2.value) { err.textContent = 'Nová hesla se neshodují.'; err.hidden = false; return; }
    const btn = document.getElementById('pwSave');
    btn.disabled = true;
    try {
      await BC.api('password/change', { method: 'POST', body: { current: form.cur.value, next: form.n1.value } });
      form.reset(); form.hidden = true; toggle.setAttribute('aria-expanded', 'false');
      BC.toast('Heslo je změněné. Na ostatních zařízeních se přihlas znovu.');
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false;
    } finally { btn.disabled = false; }
  });
  document.getElementById('logout').addEventListener('click', async () => {
    try { await BC.api('logout', { method: 'POST', allow401: true }); } catch {}
    location.href = '/';
  });
})().catch(BC.fail);
</script>
</body>
</html>
