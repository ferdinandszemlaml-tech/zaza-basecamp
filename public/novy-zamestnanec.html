<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nový zaměstnanec · ZaZa BaseCamp</title>
<meta name="theme-color" content="#0B4A44">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Righteous&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
.bc-main { padding-bottom: 48px; }
.login-link { position: relative; z-index: 1; margin-left: auto; padding: 9px 14px; border-radius: 10px; background: #fff; color: var(--green); font-size: 14px; font-weight: 700; text-decoration: none; }
.login-link:hover { background: var(--green-soft); color: var(--green); }
</style>
</head>
<body>
<header class="bc-header">
  <a class="bc-logo" href="/"><b>ZAZA</b><span>BaseCamp</span></a>
  <a class="login-link" href="/">Přihlásit se</a>
</header>
<main class="bc-main" id="main"><p class="muted">Načítám…</p></main>
<script src="/app.js"></script>
<script>
(async () => {
  const { esc } = BC;
  const { section, documents, links } = await BC.api('public/documents', { allow401: true });
  const headings = [...new Set([...documents, ...links].map((d) => d.heading))].sort((a, b) => a.localeCompare(b, 'cs'));
  const link = (v, cls) => `<a class="${cls}" href="/api/public/files/${esc(v.id)}" target="_blank" rel="noopener">${v.ext === 'pdf' ? 'Otevřít' : 'Stáhnout'}</a>`;

  document.getElementById('main').innerHTML = `
    <div class="stack" style="gap:8px">
      <span class="sec" data-sec="${esc(section.id)}">Před zkušební směnou</span>
      <h1>${esc(section.name)}</h1>
      <p class="lead">Vítej v ZaZa! Tady najdeš dokumenty, které je potřeba si přečíst nebo vyplnit ještě před zkušební směnou. PDF se otevře v prohlížeči, Word a Excel se stáhnou.</p>
    </div>
    ${documents.length || links.length ? headings.map((h) => `
      <div class="label">${esc(h)}</div>
      ${BC.mergeItems(documents, links, h).map((d) => d.kind === 'link' ? BC.linkCard(d) : `
        <div class="card" data-sec="${esc(section.id)}">
          <div class="doc-head">${BC.icon('file', 22, 'var(--sec)')}<span>${esc(d.title)}</span></div>
          ${d.description ? `<div class="desc">${esc(d.description)}</div>` : ''}
          ${d.versions.map((v, i) => `<div class="item">
            <span class="item-main"><span class="item-title" style="${i ? 'font-weight:600;color:var(--ink-2)' : ''}">Verze ${esc(v.version)}${i ? '' : ' <span class="muted" style="font-weight:600;font-size:13px">· aktuální</span>'}</span>
            <span class="item-sub">${BC.fmtDate(v.uploadedAt)} · ${BC.filesLabel(v)}${i ? ' · starší verze' : ''}</span>${v.note ? `<span class="vnote">${esc(v.note)}</span>` : ''}${BC.filesList(v, (f) => link(f, 'btn small soft'))}</span>
            ${v.files.length > 1 ? '' : link(v.files[0], i === 0 ? 'btn small' : 'btn small soft')}
          </div>`).join('')}
        </div>`).join('')}`).join('')
      : '<div class="card empty">Zatím tu nejsou žádné dokumenty.</div>'}
    <p class="small muted" style="text-align:center;margin-top:8px">Máš už účet? <a href="/" style="font-weight:700">Přihlas se</a>.</p>
  `;
})().catch((ex) => {
  document.getElementById('main').innerHTML = `<div class="error" role="alert">${BC.esc(ex.message)}</div>`;
});
</script>
</body>
</html>
